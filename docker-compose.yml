services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthai"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"

  frontend:
    build: ./frontend/health-ai-frontend
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_started

  auth-service:
    build: ./services/auth-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/healthai
    depends_on:
      postgres:
        condition: service_healthy

  report-service:
    build: ./services/report-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/healthai
      AWS_REGION: ap-south-1
      S3_BUCKET: healthify-ai-reports-local
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ./services/ai-service
    ports:
      - "8002:8002"
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: llama3.2:1b
    depends_on:
      - ollama

  gateway:
    build: ./gateway
    ports:
      - "9000:80"
    depends_on:
      - auth-service
      - report-service
      - ai-service

volumes:
  postgres-data: