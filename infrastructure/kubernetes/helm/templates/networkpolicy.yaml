---
# ------------------------------------------------------------
# 12. Report -> S3 via HTTPS
# ------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: report-to-s3
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: report-service
  policyTypes:
    - Egress
  egress:

    # HTTPS to AWS S3 through NAT Gateway
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
