        - ipBlock:
            cidr: 10.20.80.0/20
      ports:
        - protocol: TCP
          port: 5432

    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
