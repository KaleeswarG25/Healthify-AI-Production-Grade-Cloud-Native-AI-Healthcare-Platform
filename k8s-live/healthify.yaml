apiVersion: v1
kind: Namespace
metadata:
  name: aihealth
---
apiVersion: v1
kind: Secret
metadata:
  name: healthify-secrets
  namespace: aihealth
type: Opaque
stringData:
  POSTGRES_PASSWORD: "HealthifyDB@2026"
  DATABASE_URL: "postgresql://postgres:HealthifyDB%402026@postgres:5432/healthai"
  SECRET_KEY: "Healthify-AI-Production-Secret-2026"
  AWS_REGION: "ap-south-1"
  S3_BUCKET: "healthify-ai-reports-124502390077"
  OLLAMA_URL: "http://ollama:11434/api/generate"
  OLLAMA_MODEL: "llama3.2:1b"
  OLLAMA_NUM_CTX: "4096"
  OLLAMA_NUM_PREDICT: "256"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: aihealth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aihealth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: healthai
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthify-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d healthai
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aihealth
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: aihealth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: c7i-flex.large
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: aihealth
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-service
  namespace: aihealth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: aihealth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 124502390077.dkr.ecr.ap-south-1.amazonaws.com/healthify-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: healthify-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: healthify-secrets
                  key: SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: aihealth
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: aihealth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      serviceAccountName: report-service
      containers:
        - name: report-service
          image: 124502390077.dkr.ecr.ap-south-1.amazonaws.com/healthify-report:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: healthify-secrets
                  key: DATABASE_URL
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: healthify-secrets
                  key: AWS_REGION
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: healthify-secrets
                  key: S3_BUCKET
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: aihealth
spec:
  type: ClusterIP
  selector:
    app: report-service
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: aihealth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: 124502390077.dkr.ecr.ap-south-1.amazonaws.com/healthify-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          env:
            - name: OLLAMA_URL
              valueFrom:
                secretKeyRef:
                  name: healthify-secrets
                  key: OLLAMA_URL
            - name: OLLAMA_MODEL
              valueFrom:
                secretKeyRef:
                  name: healthify-secrets
                  key: OLLAMA_MODEL
            - name: OLLAMA_NUM_CTX
              valueFrom:
                secretKeyRef:
                  name: healthify-secrets
                  key: OLLAMA_NUM_CTX
            - name: OLLAMA_NUM_PREDICT
              valueFrom:
                secretKeyRef:
                  name: healthify-secrets
                  key: OLLAMA_NUM_PREDICT
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: aihealth
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aihealth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: 124502390077.dkr.ecr.ap-south-1.amazonaws.com/healthify-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aihealth
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aihealth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 124502390077.dkr.ecr.ap-south-1.amazonaws.com/healthify-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aihealth
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthify-alb
  namespace: aihealth
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=360
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
