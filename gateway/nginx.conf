events {}

http {

    upstream auth_service {
        server auth-service:8000;
    }

    upstream report_service {
        server report-service:8001;
    }

    upstream ai_service {
        server ai-service:8002;
    }

    upstream frontend_service {
        server frontend:80;
    }


    server {

        listen 80;

        server_name _;


        # =====================================================
        # Health check
        # =====================================================

        location = /health {
            access_log off;

            default_type application/json;

            return 200 '{"status":"healthy","service":"gateway"}';
        }


        # =====================================================
        # Authentication
        # =====================================================

        location /api/auth/ {

            proxy_pass http://auth_service/api/auth/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }


        # =====================================================
        # AI Service
        # =====================================================

        location /api/ai/ {

            proxy_pass http://ai_service/api/ai/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # AI inference can take longer.
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }


        # =====================================================
        # Report Service
        # =====================================================

        location /api/ {

            proxy_pass http://report_service/api/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }


        # =====================================================
        # Frontend
        # =====================================================

        location / {

            proxy_pass http://frontend_service;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}