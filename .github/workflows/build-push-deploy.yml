name: Build, Push, and Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - k8s-live/kustomization.yaml
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 124502390077.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push application images
        shell: bash
        run: |
          set -euo pipefail
          declare -A images=(
            [healthify-auth]=services/auth-service
            [healthify-report]=services/report-service
            [healthify-ai]=services/ai-service
            [healthify-gateway]=gateway
            [healthify-frontend]=frontend/health-ai-frontend
          )
          for image in "${!images[@]}"; do
            docker build "${images[$image]}" -t "$ECR_REGISTRY/$image:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$image:$IMAGE_TAG"
          done

      - name: Update GitOps image tag
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "s/newTag: .*/newTag: ${IMAGE_TAG}/" k8s-live/kustomization.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add k8s-live/kustomization.yaml
          git commit -m "chore: deploy ${IMAGE_TAG}" || exit 0
          git push