name: Healthify AI CI/CD

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 124502390077.dkr.ecr.ap-south-1.amazonaws.com

jobs:

  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python services
        run: |
          python -m compileall services/auth-service
          python -m compileall services/report-service
          python -m compileall services/ai-service

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/health-ai-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/health-ai-frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend/health-ai-frontend
        run: npm run build

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          helm lint infrastructure/kubernetes/helm


  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: healthify-auth
            context: services/auth-service

          - name: healthify-report
            context: services/report-service

          - name: healthify-ai
            context: services/ai-service

          - name: healthify-gateway
            context: gateway

          - name: healthify-frontend
            context: frontend/health-ai-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max